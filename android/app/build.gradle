plugins { id 'com.android.application' }

// One permanent LOCAL Rupee Rush APK signer. Never use the Nut Buster,
// ReverieVR or future Google Play upload keys for sideloaded updates.
def keystorePath = (project.findProperty('rupeeKeystorePath') ?: '').toString()
def rrStorePass = (project.findProperty('rupeeStorePassword') ?: '').toString()
def rrKeyAlias = (project.findProperty('rupeeKeyAlias') ?: '').toString()
def rrKeyPass = (project.findProperty('rupeeKeyPassword') ?: '').toString()
def versionNumber = (project.findProperty('rupeeVersionCode') ?: '1').toString().toInteger()
def publisherSha = (project.findProperty('rupeePublisherSha256') ?: '').toString().toLowerCase()
def trustedPublisher = (publisherSha ==~ /[0-9a-f]{64}/)
def expectedAlias = 'rupeerush-local-apk-v1'
def signerAvailable = keystorePath && rrStorePass && rrKeyPass &&
    rrKeyAlias == expectedAlias && file(keystorePath).isFile()
// Future Play channel: separate owner-supplied upload signer; never reuse the local APK key.
def playKeystorePath = (project.findProperty('playUploadKeystorePath') ?: '').toString()
def playStorePassword = (project.findProperty('playUploadStorePassword') ?: '').toString()
def playKeyAlias = (project.findProperty('playUploadKeyAlias') ?: '').toString()
def playKeyPassword = (project.findProperty('playUploadKeyPassword') ?: '').toString()
def havePlaySigning = playKeystorePath && playStorePassword && playKeyPassword &&
    playKeyAlias == 'rupeerush-play-upload-v1' && file(playKeystorePath).isFile()

if (versionNumber < 1 || versionNumber > 2100000000) {
    throw new GradleException('Invalid Rupee Rush versionCode')
}

android {
    buildFeatures { buildConfig true }
    namespace 'io.github.mrcalzon02.rupeerush'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.mrcalzon02.rupeerush'
        minSdk 26
        targetSdk 36
        versionCode versionNumber
        versionName '0.1.0-local.' + versionNumber
        buildConfigField 'String', 'DISTRIBUTION_SIGNER_SHA256', '"' + publisherSha + '"'
        buildConfigField 'boolean', 'UPDATE_CHANNEL_ENABLED', (signerAvailable && trustedPublisher).toString()
    }

    // Embedded current web game, including its complete asset family.
    // android/ -> ../web. Never silently stage an unrelated game project.
    sourceSets {
        main { assets.srcDirs = [rootProject.file('../web')] }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (signerAvailable) {
            rupeeLocal {
                storeFile file(keystorePath)
                storePassword = rrStorePass
                keyAlias = rrKeyAlias
                keyPassword = rrKeyPass
                storeType = 'PKCS12'
            }
        }
        if (havePlaySigning) {
            playUpload {
                storeFile file(playKeystorePath)
                storePassword = playStorePassword
                keyAlias = playKeyAlias
                keyPassword = playKeyPassword
                storeType = 'PKCS12'
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            buildConfigField 'boolean', 'UPDATE_CHANNEL_ENABLED', 'false'
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            if (signerAvailable) signingConfig signingConfigs.rupeeLocal
        }
        // Play AAB only: do not inject the historical GitHub sideload signer.
        play {
            initWith release
            signingConfig = null
            if (havePlaySigning) signingConfig signingConfigs.playUpload
            matchingFallbacks = ['release']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'androidx.core:core:1.13.1'
}

tasks.register('requirePermanentLocalSigner') {
    doLast {
        if (!signerAvailable || !trustedPublisher) {
            throw new GradleException(
                'Refusing an unsigned or debug-signed update APK. ' +
                'Run scripts/build-android-apk.ps1 to create/reuse the permanent Rupee Rush local signer.'
            )
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'assembleRelease' || task.name == 'bundleRelease') {
        task.dependsOn('requirePermanentLocalSigner')
    }
}

tasks.register('validatePlayUploadSigning') {
    doLast {
        if (!havePlaySigning) {
            throw new GradleException('Play bundle blocked: supply NEW rupeerush-play-upload-v1 upload key properties')
        }
        if (file(playKeystorePath).canonicalPath == file(keystorePath ?: '/nonexistent').canonicalPath) {
            throw new GradleException('Play bundle blocked: local Rupee Rush sideload signer must NOT be reused')
        }
    }
}
tasks.configureEach { task ->
    if (task.name in ['bundlePlay', 'assemblePlay']) {
        task.dependsOn('validatePlayUploadSigning')
    }
}
