name: Verify Painted Crop Art
on:
  push:
    paths:
      - "web/art/embryon/town/gardening/growth/painted/**"
      - "scripts/slice-painted-crops.py"
      - "scripts/requirements-crop-slicer.txt"
      - ".github/workflows/verify-painted-crop-art.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout painted source sheets and runtime sprites
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-crop-slicer.txt
      - name: Install pinned crop slicer
        run: python -m pip install -r scripts/requirements-crop-slicer.txt
      - name: Recreate and verify every painted growth sprite from source
        run: python scripts/slice-painted-crops.py --check
      - name: Check registered sprite alpha, manifests, stage IDs and archive provenance
        run: node --test tests/town-painted-crop-art.test.js tests/town-crimson-beet-candidate.test.js
